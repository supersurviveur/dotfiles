theme = "monokai_custom"

[editor]
auto-save.focus-lost = true # default: false
auto-save.after-delay.enable = true # default: false
auto-save.after-delay.timeout = 500 # range: [0; u64::MAX] default: 3000
color-modes = true
bufferline = "multiple"
preview-completion-insert = false
completion-replace = true
continue-comments = true
line-number = "relative"
end-of-line-diagnostics = "disable"

[editor.soft-wrap]
enable = true

[editor.lsp]
display-inlay-hints = true
display-messages = true

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true

[editor.statusline]
left = ["mode", "spinner", "version-control", "spacer", "workspace-diagnostics"]
center = ["file-name", "read-only-indicator"]
right = ["position", "total-line-numbers", "separator", "file-encoding", "file-line-ending", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.whitespace.render]
nbsp = "all"
nnbsp = "all"

[editor.whitespace.characters]
nbsp = "␣"
nnbsp = "␣"

[editor.inline-diagnostics]
cursor-line = "hint"
other-lines = "error"

[keys.normal]
"S-A-e" = ":fmt"
"C-h" = "toggle_comments"
"C-d" = ["search_selection", "select_mode", "extend_search_next", "normal_mode"]
"tab" = "indent"
"S-tab" = "unindent"
A-down = ["extend_to_line_bounds", "delete_selection", "paste_after"]
A-up = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]

"C-'" = "extend_search_next"

[keys.select]
"S-A-e" = ":fmt"
"C-h" = "toggle_comments"
"C-d" = ["search_selection", "select_mode", "extend_search_next", "normal_mode"]
"tab" = "indent"
"S-tab" = "unindent"
A-down = ["extend_to_line_bounds", "delete_selection", "paste_after"]
A-up = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]

"C-'" = "extend_search_next"

"p" = "replace_with_yanked"

[keys.select.space]
"p" = "replace_selections_with_clipboard"

[keys.insert]
"S-A-e" = ":fmt"
"C-h" = "toggle_comments"
"C-d" = ["search_selection", "select_mode", "extend_search_next", "insert_mode"]
A-down = ["extend_to_line_bounds", "delete_selection", "paste_after", "move_line_down"]
A-up = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before", "move_line_up"]

"C-space" = "completion"
